services:

  at_hop_transaction_scraper:
    container_name: at_hop_transaction_scraper
    build:
      context: .
      args:
        # Match the owner of ./data so the container can write to it
        UID: ${APP_UID:-1000}
        GID: ${APP_GID:-1000}
    restart: always
    volumes:
      - "./data:/data"
    environment:
      - AT_USERNAME=${AT_USERNAME}
      - AT_PASSWORD=${AT_PASSWORD}
      - AT_CARDS=${AT_CARDS}
      - AT_DATABASE_FILE=/data/athop.db
      - AT_PERIOD=${AT_PERIOD:-3600}
      - AT_STARTUP_DELAY=${AT_STARTUP_DELAY:-60}
      - AT_SLACK_API_TOKEN=${AT_SLACK_API_TOKEN}
      - AT_SLACK_CHANNEL=${AT_SLACK_CHANNEL}
      - AT_GTFS_URL=${AT_GTFS_URL:-https://gtfs.at.govt.nz/gtfs.zip}
      - AT_GTFS_REFRESH_DAYS=${AT_GTFS_REFRESH_DAYS:-7}
      - AT_GTFS_DATABASE_FILE=/data/gtfs.db
      - AT_MAPBOX_TOKEN=${AT_MAPBOX_TOKEN}
      - AT_MAPBOX_STYLE=${AT_MAPBOX_STYLE:-mapbox/streets-v12}
